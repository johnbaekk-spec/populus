# Gitleaks policy — RUN PUBLIC-SECURITY-HARDENING PR 1 (R5, Task 4 step 2).
#
# Extends the default ruleset shipped inside the pinned container
# (ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f,
# Gitleaks 8.30.1). No custom rules; no path/directory allowlists.
#
# False positives are excluded ONLY by exact fingerprint in .gitleaksignore
# (commit:file:rule-id:line). A directory-wide or tests/-wide allowlist is a
# forbidden shortcut (plan Tech Debt section), not accepted debt.

[extend]
useDefault = true
