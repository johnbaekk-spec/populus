# Curated manager registry — display names and manager typing for 13F filers.
#
# WHY THIS FILE EXISTS: 13F filings carry a filed manager name but no
# human-readable display name and no manager classification. Nothing in the
# pipeline derives either. This seed supplies both for a curated subset.
#
# COVERAGE IS A CURATED SUBSET, NOT THE POPULATION. Roughly 8,700 filers
# exist; this file types 113 of them. Any surface built on it must state that.
#
# `notable` is an EDITORIAL FLAG, ORTHOGONAL TO `manager_type`. A notable
# hedge fund is both notable AND a hedge fund, and must appear under both
# filters. Never collapse these into one field.
#
# PROVENANCE: every row's cik and sec_name were confirmed against a primary
# SEC source on the recorded date. Channels:
#   A = EDGAR company browse (action=getcompany, type=13F-HR)
#   B = data.sec.gov submissions API (CIK##########.json), 13F-HR present
#   C = EDGAR full-text search (efts.sec.gov), forms=13F-HR, 2026 window
# Channel A alone proves a CIK EVER filed a 13F-HR, not that it still does; every
# row below was additionally confirmed to join the published agg_filer_registry.
#
# `status`: active = must join the filer registry or the build FAILS naming the CIK.
#           retired = deliberately excluded from typed views without failing.
# A candidate no channel could confirm is EXCLUDED below, never guessed.
#
# MAINTENANCE: see the registry maintenance contract in PLAN.md. Rows are
# re-verified on the recorded cadence; `verified_date` is the expiry clock.

version: 1

# The filer-population scale this seed is written against. It is DECLARED here,
# not inferred at build time, because "is this the population?" is a policy
# question about the corpus and a build that guesses it can guess wrong in the
# direction that hides a broken join.
#
# A publication build over an aggregate with at least this many filers runs the
# curation gate UNCONDITIONALLY: every active row must join, and a zero-match
# result is a catastrophic join defect rather than a small module. Below it, the
# aggregate is a fixture or a partial extract and the coverage gate abstains.
#
# Measured 2026-08-22: the published aggregate carries 9,451 filers; a local
# single-quarter extract carries 998; publish-test fixtures carry 3.
population_floor: 5000

