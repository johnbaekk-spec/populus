# member_aliases seed (ARCHITECTURE.md §9.4/§9.7).
#
# Every fuzzy-match decision is a reviewed commit: automatic §9.7 name
# resolution never guesses, so a filer name the matcher cannot resolve to
# exactly one member is joined ONLY by adding a row here. Rows load into the
# member_aliases table via `populus ingest members` (full replace).
#
# Entry format (one list item per mapping):
#   - alias:       the filer name as the source prints it (normalized at load
#                  through members.normalize_filer_name, so "Khanna, Rohit"
#                  and "Rohit Khanna" are one alias)
#     chamber:     house | senate
#     state:       optional disambiguator; omitted = matches any filing
#     district:    optional disambiguator (House), zero-stripped ("4", "0")
#     valid_from:  ISO date; the alias applies to filings with
#                  valid_from <= filed_date < valid_to
#     valid_to:    optional ISO date; omitted = open-ended
#     bioguide_id: the member this alias resolves to
#     note:        REQUIRED — why this mapping exists (the reviewed
#                  justification; entries without a note are rejected)
#
# Resolution additionally requires the member to hold a term of the alias's
# chamber overlapping the filing's filed_date, so none of these rows can
# time-travel (G14). Overlapping applicable rows for one (alias, date) are a
# defect caught by the CI invariant test (members.alias_overlap_errors).
#
# Every entry below was verified against data-cache/legislators (name parts,
# bioguide, per-chamber first-term start) and the observed filer strings in
# the House index / Senate eFD index / kadoa seed on 2026-07-23. The dominant
# class is a legislators first name recorded only in its short form ("Ro",
# "Rick", "Tommy") while the disclosure source prints the formal form.
