# Dependabot — RUN PUBLIC-SECURITY-HARDENING PR 1 (R13, Task 3 step 3).
# Weekly update PRs for all three ecosystems; non-major development updates are
# grouped per ecosystem to keep the review load bounded; security updates are
# never ignored. Open-PR count is capped at a reviewable number.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev-minor:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dev-minor:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-dev-minor:
        update-types:
          - "minor"
          - "patch"
