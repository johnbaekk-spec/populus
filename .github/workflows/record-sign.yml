# Top-level record signer (ARCHITECTURE.md §12.1 step 6, §5.5, §14).
#
# GitHub attestations identify a workflow, not a job — `record-sign.yml` is the
# distinct, pinnable signer identity verifiers use for deployment generations
# (§5.5). It is a separately dispatched TOP-LEVEL workflow because probe run
# 33473559423 proved environment secrets resolve empty in a reusable called job
# even though a direct job receives the same environment secret. This workflow
# holds Pages READ only, never Pages Write, and it trusts NO dispatcher output:
# source-run metadata comes from GitHub's API, `build_id` from the attested
# pointer/manifest, `code_sha`/`dist_digest`/inventory from the downloaded
# artifact, and the production deployment id from Cloudflare with its own
# read-only token. Whatever the dispatcher claims is cross-checked.
#
# POPULUS_RECORD_SIGN_ARMED is checked by a FAILING first step, not a job-level
# `if`: a separately dispatched workflow whose only job skips can conclude
# successfully. The watcher must receive a non-zero conclusion when unarmed.
name: record-sign

on:
  workflow_dispatch:
    inputs:
      # Correlates this exact request with its watcher. A publish job re-run has
      # the same source run id but a new run attempt, so source-run-id alone is
      # not unique enough to prevent a stale-success false positive.
      request-id:
        description: "Unique dispatcher request id"
        type: string
        required: true
      # The data-publish run that created and uploaded the site artifact. The
      # signer validates its path, branch, event, status, and head SHA through
      # GitHub's API before it trusts this only as a locator.
      source-run-id:
        description: "Source data-publish workflow run id"
        type: string
        required: true
      # The artifact the deploy leg uploaded: `site/**` plus the sibling
      # `inventory.json` (§12.1 envelope). Named, not guessed.
      artifact-name:
        description: "Exact source-run artifact name"
        type: string
        # REQUIRED, and deliberately with no default. `site` was the default and
        # the publisher uploads `site-<build_id>`, so a caller that omitted this
        # would download nothing and fail in the signer with a message about a
        # missing artifact rather than about the mismatch. A default that is
        # wrong for the only real caller is worse than no default.
        required: true
      # Provenance metadata the signer cannot re-derive: a download step is not
      # told the artifact's id, and nothing in the verification depends on it —
      # the bytes are proved by dist_digest/inventory_digest, which ARE
      # recomputed here. Recorded as declared, or null when absent.
      dist-artifact-id:
        type: string
        required: false
        default: ""
      dist-artifact-expires-at:
        type: string
        required: false
        default: ""
      # The deploy job's claim about which deployment went live. It is checked
      # against the Pages API answer and never substituted for it; a mismatch
      # is a finding that refuses the attestation.
      cf-production-deployment-id:
        description: "Deploy job's claimed Cloudflare production deployment id"
        type: string
        required: false
        default: ""

run-name: record-sign request ${{ inputs.request-id }} for source-run ${{ inputs.source-run-id }}

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  record:
    runs-on: ubuntu-latest
    # R4/LD5 — the signer's two secrets live only in this environment
    # (selected branch `main`): the data PAT and the Pages READ token, plus
    # the attestation permissions granted by the caller. Never Pages Write.
    environment: production-record-sign
    steps:
      - name: Require the signer to be armed
        env:
          RECORD_SIGN_ARMED: ${{ vars.POPULUS_RECORD_SIGN_ARMED }}
        run: |
          if [ "$RECORD_SIGN_ARMED" != "true" ]; then
            echo "::error::POPULUS_RECORD_SIGN_ARMED is not true."
            exit 1
          fi

      # The input is only a locator. The API answer must prove that it names a
      # main-branch data-publish run; its trusted head SHA is cross-checked
      # against the code marker derived from the artifact below.
      - name: Validate the source publish run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: |
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*)
              echo "::error::source-run-id must contain decimal digits only."
              exit 1
              ;;
          esac
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          source_path="$(gh api "$endpoint" --jq '.path')"
          source_branch="$(gh api "$endpoint" --jq '.head_branch')"
          source_sha="$(gh api "$endpoint" --jq '.head_sha')"
          source_status="$(gh api "$endpoint" --jq '.status')"
          source_event="$(gh api "$endpoint" --jq '.event')"

          if [ "$source_path" != ".github/workflows/publish.yml" ]; then
            echo "::error::source run uses ${source_path}, not publish.yml."
            exit 1
          fi
          if [ "$source_branch" != "main" ]; then
            echo "::error::source run branch is ${source_branch}, not main."
            exit 1
          fi
          if [ "$source_status" != "in_progress" ] && [ "$source_status" != "completed" ]; then
            echo "::error::source run status is ${source_status}."
            exit 1
          fi
          if [ "$source_event" != "workflow_dispatch" ] && [ "$source_event" != "schedule" ]; then
            echo "::error::source run event is ${source_event}."
            exit 1
          fi
          case "$source_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "::error::source run returned a malformed head SHA."
              exit 1
              ;;
          esac
          echo "head_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out populus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out populus-data (private staging)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: johnbaekk-spec/populus-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: populus-data

      - name: Install uv (version-pinned)
        run: python3 -m pip install --quiet 'uv==0.7.13'

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      # The signer locates the immutable artifact in the validated source run
      # and downloads it itself (§5.5). The tree is re-hashed on arrival.
      - name: Download the deployed site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      # Every variable is step-scoped (§14 least privilege). GH_TOKEN is the
      # job's own ephemeral token, present so the pointer/manifest attestation
      # lookups are authenticated: unauthenticated they share a 60/hour cap per
      # runner IP, and a quota error in the step that decides whether to attest
      # must never be confusable with a verification failure.
      #
      # The project name and the custom domain are locked here (§14), the
      # account id is a non-secret Actions variable, and the Pages token is the
      # signer's own Pages-Read-only credential.
      - name: Verify the served tree and record the deployment generation
        id: record
        env:
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          DIST_ARTIFACT_ID: ${{ inputs.dist-artifact-id }}
          DIST_ARTIFACT_EXPIRES_AT: ${{ inputs.dist-artifact-expires-at }}
          CLAIMED_DEPLOYMENT_ID: ${{ inputs.cf-production-deployment-id }}
          CLAIMED_CODE_SHA: ${{ steps.source.outputs.head_sha }}
        run: >-
          uv run python -m populus.deploy.record
          --data-repo populus-data
          --artifact artifact
          --project publicfilings
          --domain publicfilings.org
          --workflow-run-id "$SOURCE_RUN_ID"
          --dist-artifact-id "$DIST_ARTIFACT_ID"
          --dist-artifact-expires-at "$DIST_ARTIFACT_EXPIRES_AT"
          --claimed-deployment-id "$CLAIMED_DEPLOYMENT_ID"
          --claimed-code-sha "$CLAIMED_CODE_SHA"
          --attestation sigstore

      # R25 — subject-name + subject-digest, NEVER subject-path. With a path the
      # action names the subject by BASENAME, so a generation written to
      # builds/<id>/deployments/<gen>.json would attest as `<gen>.json` —
      # a name `attestation.resolve_identity` refuses outright (it is neither in
      # SUBJECT_IDENTITIES nor under the `deployments/` prefix), and which
      # `_subject_name_matches` would then fail to match against the pinned
      # name. Both readings fail, so the record would be unverifiable by the
      # verifier this project already ships. The name comes from the signer's
      # own output, so this file cannot drift from the code that pinned it.
      #
      # Pinned to the commit `v2` resolves to: `v2` is an ANNOTATED tag, so its
      # ref sha (96b4a1ef…, the value publish.yml carries) names a tag object
      # rather than the commit e8998f9… below.
      - name: Attest the deployment generation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.record.outputs.subject_name }}
          subject-digest: ${{ steps.record.outputs.subject_digest }}

      # Attest BEFORE commit, for the same reason publish.yml attests before it
      # commits the pointer: the ordering is the enforcement. A generation that
      # could not be attested is never pushed, so the §13.2 monitor and the
      # pre-publish gate see "no record" rather than an unsigned one.
      - name: Commit the deployment generation (rebase-retry x3, §13.3)
        working-directory: populus-data
        run: |
          git config user.name "populus-record-sign[bot]"
          git config user.email "populus-record-sign@users.noreply.github.com"
          git add builds
          git commit -m "deploy: record generation ${{ steps.record.outputs.generation }}"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 rebase retries (no force push, ever)" >&2
          exit 1
