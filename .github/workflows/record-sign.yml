# Reusable record signer (ARCHITECTURE.md §12.1 step 6, §14) — a NO-OP SHELL
# until P3: the guard requires POPULUS_RECORD_SIGN_ARMED == 'true', which is
# not provisioned before the dashboard exists. The workflow_call shape, the
# three attestation permissions, and the Pages-Read-only token env name are
# the settled §14 contract; the P3 body implements the inventory-wide
# served-tree verification and attests the deployment generation.
#
# This is a SEPARATE reusable workflow because GitHub attestations identify a
# workflow, not a job — record-sign.yml is the distinct, pinnable signer
# identity (§5.5). It must hold Pages READ only, never Pages Write.
name: record-sign

on:
  workflow_call: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  record:
    if: vars.POPULUS_RECORD_SIGN_ARMED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify served tree and record deployment generation (P3 body)
        env:
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
        run: |
          echo "record-sign: no-op until P3 (POPULUS_RECORD_SIGN_ARMED gates execution)."
          echo "P3 implements §12.1 step 6: download the immutable dist artifact,"
          echo "recompute dist_digest and inventory_digest, fetch every inventoried"
          echo "path from the deployment URL with redirects disabled, run the"
          echo "closure-narrowing provider checks, then attest the generation."
