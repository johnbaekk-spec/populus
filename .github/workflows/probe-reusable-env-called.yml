name: probe-reusable-environment-secret-called

on:
  workflow_call:
    secrets:
      PROBE_VALUE:
        required: false

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: probe-reusable-workflow-secret-20260901
    steps:
      - name: Report only secret emptiness and length
        env:
          PROBE_SECRET: ${{ secrets.PROBE_VALUE }}
        run: |
          if [ -z "$PROBE_SECRET" ]; then
            echo "probe_empty=true"
          else
            echo "probe_empty=false"
          fi
          echo "probe_length=${#PROBE_SECRET}"
