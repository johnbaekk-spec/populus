name: probe-reusable-environment-secret-caller

on:
  push:
    branches:
      - codex/probe-reusable-env-secret-20260831

permissions: {}

jobs:
  direct-control:
    runs-on: ubuntu-latest
    environment: probe-reusable-workflow-secret-20260901
    steps:
      - name: Report only direct secret emptiness and length
        env:
          PROBE_SECRET: ${{ secrets.PROBE_VALUE }}
        run: |
          if [ -z "$PROBE_SECRET" ]; then
            echo "direct_empty=true"
          else
            echo "direct_empty=false"
          fi
          echo "direct_length=${#PROBE_SECRET}"

  called-probe:
    uses: ./.github/workflows/probe-reusable-env-called.yml
