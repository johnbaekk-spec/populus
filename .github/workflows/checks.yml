# PR gates. Nothing here touches the data repo, Cloudflare, or any secret.
#
# WHY THIS EXISTS: on 2026-08-12 three PRs merged with ZERO checks. One of them
# edited two GENERATED files without their generator, which turned
# tests/test_licenses.py red on `main` — and that red gate then survived a merge
# AND a production deploy, because nothing ran it. `make test` had caught it
# locally in 80 seconds; nothing asked.
#
# SCOPE: the suites that need no published data build — the full Python tree,
# the dashboard typecheck, and the dashboard unit suite, plus two security
# gates (full-history secret scan and dependency review). The post-build gates
# (`npm run test:post`) are deliberately NOT here: they require a real
# `POPULUS_BUILD_DIR` + release DBs, which live in the private data repo, so
# they stay with the publisher-side workflow that has them.
#
# HOST-BOUND SUITES SKIP THEMSELVES, they are not excluded here. The first run of
# this workflow surfaced 163 failures that were entirely environmental, and the
# fix belongs in the tests rather than in a CI ignore-list:
#   * tests/test_runner_controller.py — executes a macOS-only script (BSD
#     `stat -f`); skips on non-Darwin.
#   * tests/test_m2_11_qa_bundle.py — drives a builder pinned to absolute
#     owner-machine paths; skips when they are absent.
# It also caught one REAL portability defect: SQL using the digit separator
# `9_000_000`, which SQLite rejects before 3.46.
#
# The consequence is honest and worth stating: on a GitHub runner this job proves
# LESS than `make test` does on the owner's machine, because those suites can only
# be authoritative where their subject lives.
name: checks

# FORK-SAFE `pull_request` POLICY (RUN PUBLIC-SECURITY-HARDENING, LD3/R2):
# the earlier repo-wide ban on PR-like triggers existed because PR triggers
# route untrusted content toward runners. Now that the repository is public,
# a fork PR must run checks BEFORE merge, so `pull_request` is allowed — but
# only in THIS workflow, and only because every job here is structurally
# fork-safe: GitHub-hosted runners only, `permissions: contents: read`, no
# environment, no secrets-context interpolation, no reusable-workflow call,
# and `persist-credentials: false` on every checkout. (The governance test
# scans this file's raw text for any secrets-context interpolation, so this
# comment names the banned expression indirectly rather than spelling it.)
# On a `pull_request`
# event GitHub additionally hands the job a read-only token and no secrets.
# `pull_request_target` and `issue_comment` remain banned repo-wide, and the
# sole self-hosted job remains `publish.yml:publish`, unreachable from any
# PR-like trigger. tests/test_workflow_governance.py structurally enforces
# every one of these properties, with killing mutations.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (§14): read-only, no secrets referenced anywhere in this file.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # tests/test_maintenance_tooling.py reads origin/main as the tracked
          # ownership baseline. The default one-commit PR checkout has no such
          # ref and turns 191 otherwise-independent tests into the same
          # ScanError. Checkout documents 0 as all history for all branches.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml

      # `uv` from PyPI at the version publish.yml pins, so both workflows
      # resolve dependencies the same way. No third-party action.
      - name: Install uv (pinned)
        run: python3 -m pip install --quiet "uv==0.7.13"

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      # The known-failing allowlist is GONE (was B19): the three M2-11 QA-bundle
      # tests it deselected certified mid-flight states of the now-completed
      # finalization against live owner-machine evidence, which has since moved
      # on (docs-attempt cap exhausted; the 76-path closeout tree exists only in
      # the historical QA worktree). They were removed with the UX-overhaul R29
      # precondition, so the full tree runs unfiltered here, same as `make test`.
      - name: pytest (full tree, unfiltered)
        run: uv run pytest -q

  dashboard:
    name: dashboard (typecheck + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The dashboard suite is NOT pure JS: `test/inst.test.ts` spawns
      # `uv run python dashboard/test/fixtures/make-inst-preview.py` to build its
      # institutional fixture from the REAL producer rather than reimplementing
      # it (`test/post/fixture-preview.test.ts` does the same). Without uv the
      # job dies at `spawnSync uv ENOENT`.
      #
      # My "verified with no data environment" check was run on a machine that
      # already had uv, so it proved less than I claimed. Same pin as the python
      # job and publish.yml.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv (pinned)
        run: python3 -m pip install --quiet "uv==0.7.13"

      - name: Sync (frozen lockfile)
        working-directory: .
        run: uv sync --frozen

      - name: Install (frozen)
        run: npm ci

      # Neither needs a published data build — no POPULUS_BUILD_DIR / POPULUS_DB.
      - name: Typecheck
        run: npx astro check

      - name: Unit suite
        run: npm test

  # Full-history secret scan (R5). Runs Gitleaks 8.30.1 from an immutable
  # OCI-digest-pinned container over EVERY ref (`--log-opts="--all"`), with the
  # repository mounted read-only, 100% redaction, no banner, and NO report
  # file/artifact/summary — a finding fails the job and nothing else. On a PR,
  # the scanner policy (.gitleaks.toml / .gitleaksignore) is materialized from
  # the TRUSTED base SHA into read-only runner-temp files, so a fork cannot
  # edit the policy in the same PR that hides a secret. On push/dispatch the
  # checked-out (already-trusted) policy is used.
  gitleaks:
    name: gitleaks (all history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize trusted scanner policy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          POLICY_DIR="$RUNNER_TEMP/gitleaks-policy"
          mkdir -p "$POLICY_DIR"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            # PR: policy comes from the trusted base commit, never the candidate.
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git show "$PR_BASE_SHA:.gitleaks.toml" > "$POLICY_DIR/gitleaks.toml"
            git show "$PR_BASE_SHA:.gitleaksignore" > "$POLICY_DIR/gitleaksignore"
          else
            # push to main / manual dispatch: the checked-out tree IS trusted.
            cp .gitleaks.toml "$POLICY_DIR/gitleaks.toml"
            cp .gitleaksignore "$POLICY_DIR/gitleaksignore"
          fi
          chmod 0444 "$POLICY_DIR/gitleaks.toml" "$POLICY_DIR/gitleaksignore"

      - name: Scan full history (pinned container, read-only mounts)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks-policy:/policy:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
            --config /policy/gitleaks.toml \
            --gitleaks-ignore-path /policy/gitleaksignore \
            --redact=100 \
            --no-banner \
            --log-opts="--all"

  # Dependency review (R13): flags known-vulnerable or disallowed dependency
  # changes on the PR diff. Only meaningful on pull_request events (it diffs
  # base..head manifests); required-check semantics treat the push-event skip
  # as not-required for that commit context.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
