# Nightly data publish (ARCHITECTURE.md §5.5 P1, §13.3, §14) — NOT ARMED:
# the job-level guard requires the repository variable POPULUS_PUBLISH_ARMED
# to equal 'true', which is not provisioned until the staging nightly turns
# on. Secrets are referenced by NAME only; DATA_REPO_PAT is the §14 secret 4
# fine-grained PAT (populus-data Contents read/write).
#
# Least privilege (§14): the workflow token is read-only; all populus-data
# writes go through the PAT — step-scoped as GH_TOKEN on exactly the build
# and publish steps (the GitHub Release backend), never top-level, never
# echoed (R33).
name: data-publish

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      # TD-4's clearing path, and deliberately awkward to use. It exists for one
      # state: a deployment went live and could not be attested, so the R18 gate
      # blocks every future publish INCLUDING the fix. It must name the exact
      # code_sha the domain is serving, it clears no other refusal, it attests
      # nothing, and it is absent from `schedule:` so a nightly can never carry
      # one. See docs/operations/deploy.md.
      acknowledge_unrecorded_code_sha:
        description: "TD-4 override: the exact populus:code_sha the live domain serves"
        required: false
        default: ""
      # D-1c one-time bootstrap (ALPHA-UX r3-F1): declare that this publish
      # STARTS the signal-lifecycle chain because the previous build predates
      # the artifact. Absent from `schedule:` on purpose — a nightly can never
      # carry one, so an unattended run cannot cold-start lifecycle history.
      signals_bootstrap:
        description: "D-1c: start the signal lifecycle chain (one-time; previous build has no artifact)"
        required: false
        type: boolean
        default: false
      # R43 one-time corpus bootstrap. The seed carries House 2014-> but its
      # Senate floor is 2026-03-24, and the watermark rule (MAX(filed)-90d)
      # means 2012->2026-03 would never be fetched again. This adds ONE bounded
      # era ingest to fill it. Absent from `schedule:` on purpose — a nightly
      # can never re-fetch fourteen years by accident.
      senate_era_backfill:
        description: "R43: one-time bounded Senate era ingest (01/01/2012 - 04/30/2026)"
        required: false
        type: boolean
        default: false
      # R44's authorization path. `load_filing` DELETEs and replaces a filing's
      # whole parsed set, so a corrective reparse legitimately lowers its raw
      # transaction count. Naming the filing here makes that a REVIEWED event
      # visible in the dispatch log; leaving it blank makes any decrease a
      # build refusal. Absent from `schedule:` — an unattended run can never
      # authorize a corpus shrink.
      corpus_floor_allow_reparse:
        description: "R44: filing_ids whose corrective reparse is expected (space/comma separated)"
        required: false
        default: ""

permissions:
  contents: read

# §13.3: all publishing serializes in one group; a running publish is never
# cancelled — this is what guarantees at most one in-flight draft (R35).
concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  publish:
    # Default-branch guard (§14: publish only from the default branch) plus
    # the unarmed guard.
    #
    # RUN M2-11 R25 — supervised BEFORE scheduled. The third clause is not a
    # second arming switch: `workflow_dispatch` is exempt on purpose, because
    # the only way to validate the self-hosted machine (T11: runner-root
    # lifecycle, toolchain gate, attestation, snapshot identity) is to dispatch
    # a run at it while the owner is watching. A nightly is the opposite — it
    # fires at 06:17 UTC with nobody present — so an unattended schedule waits
    # until the owner has SEEN a supervised run succeed and only then sets
    # POPULUS_SELFHOSTED_VALIDATED. Unset (or anything but 'true') therefore
    # means "dispatch works, the nightly does not", which is the state this
    # branch ships in.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.POPULUS_PUBLISH_ARMED == 'true' &&
      (github.event_name != 'schedule' ||
       vars.POPULUS_SELFHOSTED_VALIDATED == 'true')
    # RUN M2-11 R5/LD-1 — the publish job, and ONLY the publish job, runs on
    # the owner's Mac: it is the machine that holds the 21 GB institutional
    # audit store, and the accepted source snapshot cut from it is far too
    # large to ship to a hosted runner. The label list is exact and pinned by
    # tests/test_publish.py; `self-hosted` alone would match any future runner
    # registered on the account.
    #
    # deploy / sign / assert-signed deliberately STAY GitHub-hosted below —
    # they hold the Cloudflare-write and attestation authority whose §14
    # isolation analysis assumes an ephemeral hosted runner, and none of them
    # needs the store. See ARCHITECTURE.md §13.1.
    runs-on: [self-hosted, macOS, populus-ops]
    # RUN PUBLIC-SECURITY-HARDENING R4/LD5 — DATA_REPO_PAT is an ENVIRONMENT
    # secret now, resolved only inside `production-data-publish`, whose
    # deployment branch policy is selected-branch `main`. This job holds the
    # data PAT and NO Cloudflare token; the three privilege domains
    # (publish / deploy / record-sign) each have their own environment and
    # never combine. Until the owner creates the environment and enters the
    # secret, this reference resolves to the empty string and the job fails
    # CLOSED — which is the intended state while publishing is disarmed.
    environment: production-data-publish
    # RUN P3-3a R1/R9 — job-scoped least privilege (§14). `attestations: write`
    # is required to create bundles and also permits reading them back, so the
    # Verify step's lookups are authenticated: without a token they fall to the
    # 60/hour unauthenticated cap shared per runner IP, and a quota error would
    # be indistinguishable from tampering in the step that gates the pointer
    # commit. This job still holds NO Cloudflare credential (§14 invariant).
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Consumed by the deploy and sign jobs. `deployed` is false when the build
    # was preserved or reconciled rather than assembled — already published and
    # journal-sealed, so re-deploying it would re-produce a sealed journal for
    # artifacts that never changed.
    outputs:
      build_id: ${{ steps.stage.outputs.build_id }}
      deployed: ${{ steps.stage.outputs.fresh }}
    steps:
      - name: Check out populus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out populus-data (private staging)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: johnbaekk-spec/populus-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: populus-data

      # RUN M2-11 R10 — OS-tolerant, and still exactly as pinned as before.
      #
      # `python3 -m pip install` is not a portable way to obtain uv on this
      # job any more. macOS system and Homebrew Pythons are PEP 668
      # externally-managed: a plain pip install into them EXITS NON-ZERO with
      # `error: externally-managed-environment` and installs nothing, so the
      # old one-liner would fail this job on the very first step of every run.
      #
      # On the self-hosted machine uv is part of the root-owned, read-only
      # toolchain the controller checksums and puts on PATH before the runner
      # ever registers (docs/runbooks/self-hosted-runner.md §4) — so the right
      # thing there is to USE it, never to reinstall it over the top of the
      # gated copy. The pip fallback remains for a runner with no uv at all,
      # which is the GitHub-hosted shape this job reverts to under the plan's
      # rollback.
      #
      # Either way the pin is ASSERTED, not assumed: this is the job that
      # produces the published artifacts, so a machine whose toolchain drifted
      # is a silently different build environment. Fail closed and name the
      # remediation — the fix is to re-provision the toolchain, never to edit
      # the pin down to whatever the machine happens to have.
      - name: Install uv (version-pinned)
        env:
          UV_PIN: "0.7.13"
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            python3 -m pip install --quiet "uv==${UV_PIN}"
          fi
          have="$(uv --version 2>/dev/null | awk '{print $2}')"
          if [ "$have" != "$UV_PIN" ]; then
            echo "::error::uv on PATH reports '${have:-<none>}', pinned ${UV_PIN}."
            echo "::error::Re-provision the root-owned toolchain and regenerate"
            echo "::error::controller/toolchain.manifest (self-hosted-runner.md"
            echo "::error::step 4), then restart the controller."
            exit 1
          fi
          echo "uv ${have} (pinned)"

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      # RUN P3-3b R18/R20 — the previous deploy must have left a VERIFIED,
      # attestation-backed generation before this run publishes anything.
      #
      # Named "Gate on ..." and not "Verify ...": `_step_index` in
      # tests/test_attestation_structure.py resolves steps by substring, so a
      # step whose name contains "verify" placed before the Attest step would
      # capture that lookup and break three unrelated ordering assertions for a
      # reason none of them states.
      #
      # It holds NO Cloudflare credential — §14 forbids this job one — so the
      # live check is an unauthenticated fetch of the site's own marker, and the
      # generation comes from the populus-data checkout this job already has.
      - name: Gate on prior deployment generation
        env:
          GH_TOKEN: ${{ github.token }}
          # Same injection class as the corpus-floor input below: a free-text
          # dispatch value must never be substituted into the script body.
          ACKNOWLEDGE_UNRECORDED_CODE_SHA: ${{ inputs.acknowledge_unrecorded_code_sha }}
        run: >-
          uv run python -m populus.deploy.record gate
          --data-repo populus-data
          --domain publicfilings.org
          --acknowledge-unrecorded-code-sha "$ACKNOWLEDGE_UNRECORDED_CODE_SHA"

      # Fetched BEFORE the ingests on purpose. Run 31861037053 spent 2h11m on
      # the ingests and then died in this fetch on a one-line error (an unset
      # `vars.POPULUS_CONTACT` arrives as the EMPTY STRING, so the User-Agent
      # was "Populus " and httpx refused it). The roster download depends on
      # nothing the ingests produce, so anything that can fail in it — network,
      # a bad contact, a truncated body — should fail in the first minute.
      # The JOIN still runs after the ingests, because it joins their filings.
      - name: Fetch the legislators cache (fail fast, before the long ingests)
        env:
          POPULUS_CONTACT: ${{ vars.POPULUS_CONTACT }}
        run: uv run python scripts/fetch_legislators_cache.py --dest data-cache/legislators

      # R42 — SEED FORWARD. Before this step the runner built populus.db from
      # nothing every run, and House `default_years` fetches the current year
      # only, so a decade of House history could never come back (B25). The
      # seed is authenticated through the same pointer -> manifest -> asset
      # chain the rest of the pipeline uses and verified byte-exactly.
      #
      # It REFUSES when there is neither a fetchable release nor the bootstrap
      # override. There is deliberately no fresh-database fallback: that path
      # is the cause of B24 and B25, not a rollback from them.
      #
      # POPULUS_CONGRESS_SEED_DB is a MACHINE-LOCAL PATH on the self-hosted
      # runner, the same posture as POPULUS_INST_DB, and is set only for the
      # one R43 bootstrap dispatch. Both variables are unset afterwards; unset
      # arrives as the EMPTY STRING and is treated as absent.
      - name: Seed the corpus from the previous release (R42)
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
          POPULUS_CONGRESS_SEED_DB: ${{ vars.POPULUS_CONGRESS_SEED_DB }}
          POPULUS_CONGRESS_SEED_SHA256: ${{ vars.POPULUS_CONGRESS_SEED_SHA256 }}
        run: >-
          uv run populus seed-corpus
          --db populus.db
          --counts seed-counts.json
          --data-repo populus-data
          --backend gh-release
          --repo johnbaekk-spec/populus-data

      - name: Ingest (live, raw-archived)
        run: |
          uv run populus ingest congress-house --db populus.db --raw-root raw
          uv run populus ingest congress-senate --db populus.db --raw-root raw

      # R43 — the one-time era fill, bounded on BOTH ends. The upper bound is
      # what makes it an era request rather than "start -> forever"; the
      # overlap with the seed's 2026-03-24 Senate floor is harmless because
      # ingest upserts.
      - name: Senate era backfill (R43, one-time bootstrap only)
        if: ${{ inputs.senate_era_backfill }}
        run: >-
          uv run populus ingest congress-senate --db populus.db --raw-root raw
          --submitted-start 01/01/2012 --submitted-end 04/30/2026

      # THE MEMBER JOIN. Without this step the two ingests above leave
      # `transactions.bioguide_id` entirely NULL, because `members.apply_member_join`
      # — the only writer of that column — runs solely inside `ingest members`.
      # The store is SEEDED from the previous release (R42), not built fresh, so
      # it arrives carrying the previous run's roster and joins. That is exactly
      # why the corpus floor below proves THIS run's join executed rather than
      # trusting a nonzero join count: historical joins keep stage_build's
      # total-absence guard satisfied whether or not this step ran at all.
      #
      # Missing since the workflow was written: builds 20260807.1 through
      # 20260812.1 all published a site with ZERO member pages, and live 404s
      # every `/congress/members/<bioguide>` today. `build.py` now REFUSES a
      # build in that state rather than emitting an identity-less site.
      #
      # `ingest members` is offline-only by design (library code performs no
      # network access), so the cache is fetched first by a script — the same
      # split the SIC snapshot producer uses. Source is CC0 and registered as
      # `cc0-legislators` in the §15 conditions register.
      - name: Ingest members (identity join)
        run: |
          uv run populus ingest members --db populus.db \
            --from-cache data-cache/legislators

      # R44 — the corpus floor, AFTER the join and BEFORE the build, because it
      # checks join identities as well as filing identities.
      #
      # It also proves THIS run's member join executed. `stage_build`'s
      # total-absence guard cannot: a seeded store arrives with historical
      # joins already nonzero, so that guard is permanently satisfied whether
      # or not the members step above ran at all — which is exactly how B24
      # stayed invisible for seven releases.
      # The authorization list reaches the command through the ENVIRONMENT,
      # never interpolated into the script body. `${{ }}` substitution happens
      # BEFORE the shell parses the line, so a single quote in this free-text
      # dispatch input would close the quoting and run the remainder as
      # commands — as the runner account, on the owner's Mac. Env values are
      # not script text, so quoting is all that is required here.
      - name: Corpus floor (R44)
        env:
          CORPUS_FLOOR_ALLOW_REPARSE: ${{ inputs.corpus_floor_allow_reparse }}
        run: >-
          uv run populus corpus-floor
          --db populus.db
          --counts seed-counts.json
          --allow-reparse "$CORPUS_FLOOR_ALLOW_REPARSE"

      # --- the two-phase build seam (RUN P3-3b R2) --------------------------
      # The site is built BETWEEN these two steps: it reads manifest.json to
      # decide which surfaces exist, and its file count is what finalize-build
      # patches into stats.json. stage-build writes a provisional manifest;
      # finalize-build discards it, re-assembles, and only then journals (R35).
      #
      # stage-build exits 3 when the build was preserved or reconciled rather
      # than assembled. That is recovery working correctly, not an error — but
      # there is then nothing to build a site from and nothing to deploy, so the
      # remaining steps are skipped and the summary says so out loud (an
      # operator who dispatched a redeploy must not read a green run as a
      # deploy).
      - name: Stage build
        id: stage
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
          # RUN M2-11 R4/LD-2 — the accepted institutional source snapshot is
          # addressed ONLY through this repository VARIABLE. `vars.`, never
          # `secrets.`: a repository variable read through `secrets.` resolves
          # to the empty string SILENTLY (the same trap the Cloudflare account
          # id documents on the deploy step below), and an empty path here
          # would either build congress-only under a name that says otherwise
          # or hand the CLI an empty argument.
          #
          # The env key is INST_SOURCE_DB and not POPULUS_INST_DB on purpose:
          # the site-build step further down already sets POPULUS_INST_DB to
          # something else entirely — the DERIVED inst_agg.db under the staging
          # dir, which is what the dashboard reads. Two different files, one
          # name, would be a genuine foot-gun in one file.
          #
          # No machine path is committed anywhere: the variable is provisioned
          # on the repo, and the value only exists on the machine that holds
          # the snapshot.
          INST_SOURCE_DB: ${{ vars.POPULUS_INST_DB }}
        run: |
          # Unset MUST mean the flag is OMITTED ENTIRELY — not passed empty.
          # Built as positional parameters rather than a string, so no quoting
          # accident can turn an unset variable into a flag with an EMPTY
          # argument (which the CLI refuses) or split a path on whitespace.
          # With the variable unset the command below is character-for-character
          # the congress-only command this workflow ran before RUN M2-11, which
          # is what makes the unset path byte-identical to today (R1/R18).
          set --
          if [ -n "${INST_SOURCE_DB:-}" ]; then
            set -- --inst-db "$INST_SOURCE_DB"
          fi
          set +e
          uv run populus stage-build --attestation=sigstore --db populus.db \
            --data-repo populus-data --backend gh-release --repo "$GH_REPO" \
            --raw-root raw "$@" | tee stage.out
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" = "3" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Build preserved — nothing deployed"
              echo
              echo "Recovery adopted an existing build. It is already published"
              echo "and sealed, so the site build and deploy were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$status" = "0" ] || exit "$status"
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          # The build directory is reported by the CLI, never spelled here: the
          # §13.4 guard forbids a staging path literal in any step body.
          # `grep` exits 1 on no match, so under `set -e` a missing key fails the
          # step. The earlier `sed` extractor exited 0 and wrote nothing, which
          # would have handed every downstream job an empty build id.
          grep '^build_dir=' stage.out >> "$GITHUB_OUTPUT"
          grep '^build_id=' stage.out >> "$GITHUB_OUTPUT"
          grep '^staging_dir=' stage.out >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.stage.outputs.fresh == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install site dependencies (frozen)
        if: steps.stage.outputs.fresh == 'true'
        working-directory: dashboard
        run: npm ci

      # Every variable is step-scoped: tests/test_publish.py asserts there is no
      # workflow-level or job-level `env:` block at all (§14 least privilege).
      # POPULUS_TICKER_MAP is set to a path that does not exist on purpose —
      # there is no real ticker registry on a runner, and the dashboard refuses
      # a tests/fixtures path under CI, so the site renders the honest no-map
      # state rather than serving fixture-derived tickers as production data
      # (RUN P3-3b TD-7). SITE_CODE_SHA is the FULL sha; the verifier compares
      # the populus:code_sha marker exactly, never by prefix.
      # D-1c signal-lifecycle chaining (ALPHA-UX reviews F1 → r3-F1).
      #
      # The prior artifact is DURABLE, not fetched from the live site: each
      # published build carries its own `signals.v1.json` in populus-data, so
      # this reads the PREVIOUS build's copy out of the checkout already on
      # disk. A site outage, a DNS blip or a CDN 5xx can therefore never reset
      # lifecycle history — which is exactly what the live-fetch version did.
      #
      # Bootstrap is an EXPLICIT one-time state, in two shapes:
      #   * no `latest.json` at all — the genuine first publish; there IS no
      #     previous build, and that is structural, not a guess;
      #   * a pointer exists but its build predates this feature — the operator
      #     dispatches once with `signals_bootstrap: true`.
      # Anything else (pointer present, artifact missing/unreadable) FAILS the
      # build rather than publishing a silent cold start.
      - name: Resolve prior signal artifact (durable, from populus-data)
        id: prior
        if: steps.stage.outputs.fresh == 'true'
        env:
          BOOTSTRAP_INPUT: ${{ github.event.inputs.signals_bootstrap }}
        run: |
          set -euo pipefail
          pointer="populus-data/latest.json"
          if [ ! -f "$pointer" ]; then
            echo "no latest.json — genuine first publish; lifecycle starts here"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev="$(python3 -c 'import json;print(json.load(open("populus-data/latest.json"))["build_id"])')"
          candidate="populus-data/builds/${prev}/signals.v1.json"
          if [ -f "$candidate" ]; then
            echo "chaining lifecycle from build ${prev}"
            echo "path=${GITHUB_WORKSPACE}/${candidate}" >> "$GITHUB_OUTPUT"
            echo "bootstrap=" >> "$GITHUB_OUTPUT"
          elif [ "${BOOTSTRAP_INPUT:-}" = "true" ]; then
            echo "::warning::build ${prev} carries no signal artifact — DECLARED bootstrap, lifecycle starts here"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::build ${prev} carries no signals.v1.json and no bootstrap was declared."
            echo "::error::An ordinary publish must chain lifecycle state (D-1c). Dispatch once with"
            echo "::error::signals_bootstrap=true to start the chain deliberately."
            exit 1
          fi

      - name: Build site
        id: site
        if: steps.stage.outputs.fresh == 'true'
        working-directory: dashboard
        env:
          CI: "true"
          POPULUS_PRIOR_SIGNALS: ${{ steps.prior.outputs.path }}
          POPULUS_SIGNALS_BOOTSTRAP: ${{ steps.prior.outputs.bootstrap }}
          POPULUS_BUILD_DIR: ${{ github.workspace }}/${{ steps.stage.outputs.build_dir }}
          POPULUS_DB: ${{ github.workspace }}/populus.db
          POPULUS_TICKER_MAP: ${{ github.workspace }}/no-ticker-registry.json
          # Without this the site renders "this build withheld the institutional
          # module — deliberately" for a MISCONFIGURATION: inst.ts looks for
          # inst_agg.db under the build dir while build.py stages it under
          # assets/. On an honesty-first site, claiming a deliberate withholding
          # that never happened is the worst available failure.
          POPULUS_INST_DB: ${{ github.workspace }}/${{ steps.stage.outputs.staging_dir }}/assets/inst_agg.db
          SITE_CODE_SHA: ${{ github.sha }}
        run: |
          npm run build:bounded
          count=$(find dist -type f | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "site build produced no files"; exit 1; }
          echo "file_count=$count" >> "$GITHUB_OUTPUT"

      # D-1c: the artifact this build produced becomes a PUBLISHED build asset,
      # so the next run chains from populus-data rather than from the network.
      # Copied into build_dir BEFORE finalize-build, whose final manifest walk
      # hashes it like every other artifact.
      - name: Publish the signal artifact into the build
        if: steps.stage.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          src="dashboard/dist/signals/data/signals.v1.json"
          [ -f "$src" ] || { echo "::error::the site build produced no signal artifact at $src"; exit 1; }
          cp "$src" "${{ steps.stage.outputs.build_dir }}/signals.v1.json"

      # The artifact BOTH the deploy job and the signer download. Nothing
      # created it before this step, so `download-artifact` in two separate jobs
      # was reaching for a name that never existed — and neither job would have
      # said anything useful about why.
      #
      # `populus snapshot-site` freezes dashboard/dist into the §12.1 envelope:
      # `site/` plus a SIBLING `inventory.json` outside it, so the inventory
      # never inventories itself. The signer recomputes that inventory from the
      # tree and refuses to believe the shipped copy, which is the point.
      - name: Package the site artifact
        if: steps.stage.outputs.fresh == 'true'
        run: >-
          uv run populus snapshot-site --source dashboard/dist --dest site-artifact

      - name: Upload the site artifact
        if: steps.stage.outputs.fresh == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-${{ steps.stage.outputs.build_id }}
          path: site-artifact
          retention-days: 7
          if-no-files-found: error

      - name: Finalize build
        if: steps.stage.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
        run: >-
          uv run populus finalize-build
          --staging-dir "$(dirname '${{ steps.stage.outputs.build_dir }}')"
          --site-file-count '${{ steps.site.outputs.file_count }}'
          --dist-dir dashboard/dist
          --data-repo populus-data --backend gh-release --repo "$GH_REPO"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
        run: >-
          uv run populus publish --attestation=sigstore --data-repo populus-data
          --backend gh-release --repo "$GH_REPO"

      # R1: the attest step sits BETWEEN Publish and Verify deliberately. Verify
      # exits non-zero on a failed verdict, and the Commit step below has no
      # `if: always()`, so a missing or failed attestation blocks the pointer
      # commit. The ordering IS the enforcement — do not reorder these.
      - name: Attest published artifacts
        # Pinned to the COMMIT, not the `v2` tag OBJECT. `96b4a1ef…` — what this
        # line held — is the annotated tag object; `e8998f94…` is the commit it
        # points at. Both are immutable, so this was never a supply-chain hole,
        # but `uses:` resolving a tag-object sha is not something GitHub
        # documents, and this workflow has never run: a first armed deploy is a
        # bad place to discover the answer. The §14 pin test passes either way
        # (both are 40-hex), which is exactly why this needed a human to notice.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            populus-data/latest.json
            populus-data/builds/*/manifest.json

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run populus verify --data-repo populus-data --attestation=sigstore

      - name: Commit manifest and pointer (rebase-retry x3, §13.3)
        working-directory: populus-data
        run: |
          git config user.name "populus-publish[bot]"
          git config user.email "populus-publish@users.noreply.github.com"
          git add builds latest.json
          git commit -m "data: publish build"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 rebase retries (no force push, ever)" >&2
          exit 1

  # RUN P3-3b R7/T9 — the deploy job is ISOLATED, and the isolation is the point.
  #
  # §14 as amended: no JOB holds both `Pages Write` and GitHub write/attestation
  # authority. The operative fact is not the permissions block on its own —
  # workflow artifacts are a shared cross-job channel that `permissions:` does
  # not govern — it is that a job with NO `id-token: write` cannot mint an
  # attestation at all, whatever else it can reach. So this job carries the
  # Cloudflare token and `contents: read`, and nothing else.
  #
  # It never writes to populus-data, never attests, and is not trusted by the
  # signer: record-sign.yml re-derives every value from the artifact and the
  # Pages API rather than believing anything produced here (R13).
  deploy:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    # R4/LD5 — CLOUDFLARE_PAGES_EDIT_TOKEN is an ENVIRONMENT secret, resolved
    # only inside `production-pages-deploy` (selected branch `main`). This job
    # holds Pages Write and `contents: read`, and nothing else — no data PAT,
    # no id-token/attestations, per the §14 invariant.
    environment: production-pages-deploy
    permissions:
      contents: read
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Check out populus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-${{ needs.publish.outputs.build_id }}
          path: site-artifact

      # The deploy invokes the LOCK-INSTALLED dashboard/node_modules/.bin/wrangler
      # directly (R8/LD9) — never `npx`, never a deploy-time registry fetch —
      # so this job needs the pinned Node toolchain and a frozen `npm ci`.
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # R8/LD9 step 1 of 3 — install from the committed lock, with NO
      # Cloudflare credential anywhere in scope. Ordering is the enforcement:
      # install, then assert the binary/version, and only then run the one
      # token-bearing step.
      - name: Install the locked deploy toolchain (frozen, no credential)
        working-directory: dashboard
        run: npm ci

      # R8/LD9 step 2 of 3 — prove the binary the deploy will invoke exists,
      # is executable, and is EXACTLY the locked 4.60.0, before the secret is
      # exposed to any step. A missing or drifted binary fails closed here;
      # the remediation is fixing the lock, never a remote install.
      - name: Assert the lock-installed wrangler version (before any secret)
        run: |
          bin="dashboard/node_modules/.bin/wrangler"
          if [ ! -x "$bin" ]; then
            echo "::error::$bin is missing or not executable after npm ci."
            echo "::error::wrangler must come from the committed npm lock (R8);"
            echo "::error::the deploy never installs it from the registry."
            exit 1
          fi
          version="$("$bin" --version)"
          if [ "$version" != "4.60.0" ]; then
            echo "::error::$bin reports '$version', locked 4.60.0."
            echo "::error::Fix dashboard/package.json + package-lock.json;"
            echo "::error::never override the binary at deploy time."
            exit 1
          fi
          echo "wrangler $version (lock-installed)"

      - name: Install uv (version-pinned)
        run: python3 -m pip install --quiet 'uv==0.7.13'

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      # The token is STEP-scoped, never job-scoped: tests/test_publish.py
      # asserts there is no job-level `env:` block anywhere in this workflow.
      - name: Deploy to preview, verify, then production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          # `vars.`, not `secrets.` — these are repository VARIABLES (the account
          # id and project name are not secret, and are already provisioned as
          # variables). Read through `secrets.` they resolve to the empty string
          # silently, and the deploy would target account "" project "".
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          uv run python -m populus.deploy.orchestrator
          --source site-artifact/site
          --inventory site-artifact/inventory.json
          --custom-domain publicfilings.org
          --production-branch main

  # R20 — dispatch the signer as a separate TOP-LEVEL workflow run. Run
  # 33473559423 proved that, in this repository, an environment secret resolves
  # in a direct job but resolves to the empty string in a reusable called job
  # bound to the same environment. The signer must therefore own its run as
  # well as its job for `production-record-sign` to supply its two secrets.
  #
  # This dispatcher holds no production credential and no attestation or
  # contents-write authority. It can only start and observe Actions runs. The
  # unique request id prevents a re-run of this job from mistaking an older
  # successful signer for the signer it just dispatched.
  sign:
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch and require the deployment signer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_NAME: site-${{ needs.publish.outputs.build_id }}
          CLAIMED_DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
        run: |
          # This job intentionally has no checkout.  Keep every gh invocation
          # explicitly repository-scoped: without --repo, gh falls back to
          # git discovery and dies before dispatch with "not a git repository".
          title="record-sign request ${REQUEST_ID} for source-run ${SOURCE_RUN_ID}"
          gh workflow run record-sign.yml --ref main --repo "$GITHUB_REPOSITORY" \
            -f "request-id=${REQUEST_ID}" \
            -f "source-run-id=${SOURCE_RUN_ID}" \
            -f "artifact-name=${ARTIFACT_NAME}" \
            -f "cf-production-deployment-id=${CLAIMED_DEPLOYMENT_ID}"

          record_run_id=""
          for attempt in $(seq 1 24); do
            record_run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow record-sign.yml \
                --event workflow_dispatch --branch main --limit 100 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle == \"${title}\") | .databaseId" \
                | head -n 1
            )"
            if [ -n "$record_run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$record_run_id" ]; then
            echo "::error::the dispatched record-sign run did not appear."
            exit 1
          fi
          echo "watching record-sign run ${record_run_id}"
          gh run watch "$record_run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

  assert-signed:
    needs: [deploy, sign]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: A skipped or failed signer is a failed run
        run: |
          result='${{ needs.sign.result }}'
          if [ "$result" != "success" ]; then
            echo "::error::the deployment signer did not succeed (result=$result)."
            echo "::error::A deployment went live with no attested generation."
            echo "::error::Check POPULUS_RECORD_SIGN_ARMED — an unset variable"
            echo "::error::skips the job, and a skipped job reports success (R20)."
            exit 1
          fi
          echo "deployment generation signed and attested"
