name: data-publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deployment_id: ${{ steps.verify.outputs.deployment_id }}
    steps:
      - name: Download the deployed site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-20260812.1
          path: site-artifact
          github-token: ${{ github.token }}
          repository: johnbaekk-spec/populus
          run-id: 31572882267

      - name: Re-seal artifact for deployment signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-20260812.1
          path: site-artifact
          retention-days: 7
          if-no-files-found: error

      - name: Verify live Institutional surfaces and resolve deployment
        id: verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          deployment=$(curl -fsS -H "$auth" "$base?env=production")
          deployment_id=$(printf '%s' "$deployment" | jq -er '.result[0].id')
          test "$(printf '%s' "$deployment" | jq -er '.result[0].environment')" = production
          test "$(printf '%s' "$deployment" | jq -er '.result[0].url')" = https://2f3830b6.publicfilings.pages.dev

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsS https://publicfilings.org/ > "$tmpdir/home.html"
          curl -fsS https://publicfilings.org/institutional/ > "$tmpdir/inst.html"
          curl -fsS https://publicfilings.org/institutional/filers/1423053/ > "$tmpdir/citadel.html"
          curl -fsS https://publicfilings.org/institutional/data/filers/index.v2.json > "$tmpdir/index.json"

          grep -Fq 'populus:code_sha" content="d823597b69d4244b4d78c1bbf6601de4c2390e51' "$tmpdir/home.html"
          grep -Fq Institutional "$tmpdir/inst.html"
          grep -Fq 'CITADEL ADVISORS LLC' "$tmpdir/citadel.html"
          jq -e '.v == 2 and .kind == "filer-index" and .absent == null and (.routes | length > 0)' "$tmpdir/index.json"
          route=$(jq -er 'first(.routes | to_entries[]) | @base64' "$tmpdir/index.json")
          cik=$(printf '%s' "$route" | base64 -d | jq -r .key)
          shard=$(printf '%s' "$route" | base64 -d | jq -r '.value[0]')
          curl -fsS "https://publicfilings.org/institutional/data/filers/${shard}.v2.json" > "$tmpdir/shard.json"
          jq -e --arg cik "$cik" \
            '.v == 2 and .kind == "filer-fragment-shard" and (.entries | keys | any(startswith($cik + ":")))' \
            "$tmpdir/shard.json"

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "verified live deployment $deployment_id"

  sign:
    needs: verify-live
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/record-sign.yml
    secrets:
      DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
      CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
    with:
      artifact-name: site-20260812.1
      cf-production-deployment-id: ${{ needs.verify-live.outputs.deployment_id }}

  assert-signed:
    needs: [verify-live, sign]
    if: always() && needs.verify-live.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require signer success
        run: |
          test '${{ needs.sign.result }}' = success
          echo "deployment generation signed and attested"
