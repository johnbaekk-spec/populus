name: data-publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume:
    runs-on: [self-hosted, macOS, populus-ops]
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - name: Verify frozen completed build
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          repo=/Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus
          cd "$repo"
          test "$(git rev-parse HEAD)" = d823597b69d4244b4d78c1bbf6601de4c2390e51
          test -f populus-data/.staging/20260812.1/assets/inst_agg.db
          test -f populus-data/.staging/20260812.1/assets/inst_serving.db
          test -f populus-data/.staging/20260812.1/stage-state.json
          test -f site-artifact/inventory.json
          test "$(find dashboard/dist -type f | wc -l | tr -d ' ')" = 9671
          test "$(find site-artifact/site -type f | wc -l | tr -d ' ')" = 9671
          test "$(jq -r .build_id populus-data/.staging/20260812.1/stage-state.json)" = 20260812.1
          echo "build_id=20260812.1" >> "$GITHUB_OUTPUT"

      - name: Upload the frozen site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-20260812.1
          path: /Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus/site-artifact
          retention-days: 7
          if-no-files-found: error

      - name: Finalize build with recomputed serving digest
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          repo=/Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus
          cd "$repo"
          uv run python - <<'PY'
          from dataclasses import replace
          from pathlib import Path

          from populus.cli import _echo_inst_gate_outcome, _write_inst_gate_record
          from populus.db import connect
          from populus.publish.build import (
              GhReleaseBackend,
              INST_MODULE,
              INST_SERVING_ARTIFACT,
              finalize_build,
              read_stage_state,
              require_site_file_count,
          )
          from populus.publish.digests import logical_digest, projection_for

          data_repo = Path("populus-data")
          staging = data_repo / ".staging" / "20260812.1"
          serving = staging / "assets" / INST_SERVING_ARTIFACT
          staged = read_stage_state(
              staging,
              data_repo=data_repo,
              backend=GhReleaseBackend("johnbaekk-spec/populus-data"),
          )
          state = dict(staged._state or {})
          conn = connect(str(serving))
          try:
              serving_logical = logical_digest(
                  conn, projection_for(INST_SERVING_ARTIFACT, INST_MODULE)
              )
          finally:
              conn.close()
          state["inst_serving_path"] = serving
          state["inst_serving_logical"] = serving_logical
          recovered = replace(staged, _state=state)
          report = finalize_build(
              recovered, site_file_count=9671, dist_dir=Path("dashboard/dist")
          )
          _write_inst_gate_record(str(data_repo), report)
          _echo_inst_gate_outcome(report)
          require_site_file_count(report.staging_dir)
          print(f"finalized_build={report.build_id}")
          print(f"inst_serving_logical={serving_logical}")
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
        shell: bash
        run: |
          set -euo pipefail
          cd /Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus
          uv run populus publish --attestation=sigstore --data-repo populus-data \
            --backend gh-release --repo "$GH_REPO"

      - name: Attest published artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            /Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus/populus-data/latest.json
            /Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus/populus-data/builds/*/manifest.json

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus
          uv run populus verify --data-repo populus-data --attestation=sigstore

      - name: Commit manifest and pointer
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          cd /Users/johnbaek/projects/Populus-ops/runner-one-shot-r10/actions-runner/_work/populus/populus/populus-data
          gh auth setup-git
          git config user.name "populus-publish[bot]"
          git config user.email "populus-publish@users.noreply.github.com"
          git add builds latest.json
          git commit -m "data: publish build"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy:
    needs: resume
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Check out merged product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d823597b69d4244b4d78c1bbf6601de4c2390e51

      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-${{ needs.resume.outputs.build_id }}
          path: site-artifact

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: dashboard/.node-version

      - name: Install uv
        run: python3 -m pip install --quiet 'uv==0.7.13'

      - name: Sync
        run: uv sync --frozen

      - name: Deploy to preview, verify, then production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          uv run python -m populus.deploy.orchestrator
          --source site-artifact/site
          --inventory site-artifact/inventory.json
          --custom-domain publicfilings.org
          --production-branch main

  sign:
    needs: [resume, deploy]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/record-sign.yml
    secrets:
      DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
      CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
    with:
      artifact-name: site-${{ needs.resume.outputs.build_id }}
      cf-production-deployment-id: ${{ needs.deploy.outputs.deployment_id }}

  assert-signed:
    needs: [deploy, sign]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require signer success
        run: |
          test '${{ needs.sign.result }}' = success
          echo "deployment generation signed and attested"
