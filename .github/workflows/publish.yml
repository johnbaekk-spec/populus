# Nightly data publish (ARCHITECTURE.md §5.5 P1, §13.3, §14) — NOT ARMED:
# the job-level guard requires the repository variable POPULUS_PUBLISH_ARMED
# to equal 'true', which is not provisioned until the staging nightly turns
# on. Secrets are referenced by NAME only; DATA_REPO_PAT is the §14 secret 4
# fine-grained PAT (populus-data Contents read/write).
#
# Least privilege (§14): the workflow token is read-only; all populus-data
# writes go through the PAT — step-scoped as GH_TOKEN on exactly the build
# and publish steps (the GitHub Release backend), never top-level, never
# echoed (R33).
name: data-publish

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# §13.3: all publishing serializes in one group; a running publish is never
# cancelled — this is what guarantees at most one in-flight draft (R35).
concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  publish:
    # Default-branch guard (§14: publish only from the default branch) plus
    # the unarmed guard.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.POPULUS_PUBLISH_ARMED == 'true'
    runs-on: ubuntu-latest
    # RUN P3-3a R1/R9 — job-scoped least privilege (§14). `attestations: write`
    # is required to create bundles and also permits reading them back, so the
    # Verify step's lookups are authenticated: without a token they fall to the
    # 60/hour unauthenticated cap shared per runner IP, and a quota error would
    # be indistinguishable from tampering in the step that gates the pointer
    # commit. This job still holds NO Cloudflare credential (§14 invariant).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out populus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out populus-data (private staging)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: johnbaekk-spec/populus-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: populus-data

      - name: Install uv (version-pinned)
        run: python3 -m pip install --quiet 'uv==0.7.13'

      - name: Sync (frozen lockfile)
        run: uv sync --frozen

      - name: Ingest (live, raw-archived)
        run: |
          uv run populus ingest congress-house --db populus.db --raw-root raw
          uv run populus ingest congress-senate --db populus.db --raw-root raw

      # --- the two-phase build seam (RUN P3-3b R2) --------------------------
      # The site is built BETWEEN these two steps: it reads manifest.json to
      # decide which surfaces exist, and its file count is what finalize-build
      # patches into stats.json. stage-build writes a provisional manifest;
      # finalize-build discards it, re-assembles, and only then journals (R35).
      #
      # stage-build exits 3 when the build was preserved or reconciled rather
      # than assembled. That is recovery working correctly, not an error — but
      # there is then nothing to build a site from and nothing to deploy, so the
      # remaining steps are skipped and the summary says so out loud (an
      # operator who dispatched a redeploy must not read a green run as a
      # deploy).
      - name: Stage build
        id: stage
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
        run: |
          set +e
          uv run populus stage-build --attestation=sigstore --db populus.db \
            --data-repo populus-data --backend gh-release --repo "$GH_REPO" \
            --raw-root raw | tee stage.out
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" = "3" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Build preserved — nothing deployed"
              echo
              echo "Recovery adopted an existing build. It is already published"
              echo "and sealed, so the site build and deploy were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$status" = "0" ] || exit "$status"
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          # The build directory is reported by the CLI, never spelled here: the
          # §13.4 guard forbids a staging path literal in any step body.
          grep '^build_dir=' stage.out >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.stage.outputs.fresh == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install site dependencies (frozen)
        if: steps.stage.outputs.fresh == 'true'
        working-directory: dashboard
        run: npm ci

      # Every variable is step-scoped: tests/test_publish.py asserts there is no
      # workflow-level or job-level `env:` block at all (§14 least privilege).
      # POPULUS_TICKER_MAP is set to a path that does not exist on purpose —
      # there is no real ticker registry on a runner, and the dashboard refuses
      # a tests/fixtures path under CI, so the site renders the honest no-map
      # state rather than serving fixture-derived tickers as production data
      # (RUN P3-3b TD-7). SITE_CODE_SHA is the FULL sha; the verifier compares
      # the populus:code_sha marker exactly, never by prefix.
      - name: Build site
        id: site
        if: steps.stage.outputs.fresh == 'true'
        working-directory: dashboard
        env:
          CI: "true"
          POPULUS_BUILD_DIR: ${{ github.workspace }}/${{ steps.stage.outputs.build_dir }}
          POPULUS_DB: ${{ github.workspace }}/populus.db
          POPULUS_TICKER_MAP: ${{ github.workspace }}/no-ticker-registry.json
          SITE_CODE_SHA: ${{ github.sha }}
        run: |
          npm run build
          count=$(find dist -type f | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "site build produced no files"; exit 1; }
          echo "file_count=$count" >> "$GITHUB_OUTPUT"

      - name: Finalize build
        if: steps.stage.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
        run: >-
          uv run populus finalize-build
          --staging-dir "$(dirname '${{ steps.stage.outputs.build_dir }}')"
          --site-file-count '${{ steps.site.outputs.file_count }}'
          --data-repo populus-data --backend gh-release --repo "$GH_REPO"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GH_REPO: johnbaekk-spec/populus-data
        run: >-
          uv run populus publish --attestation=sigstore --data-repo populus-data
          --backend gh-release --repo "$GH_REPO"

      # R1: the attest step sits BETWEEN Publish and Verify deliberately. Verify
      # exits non-zero on a failed verdict, and the Commit step below has no
      # `if: always()`, so a missing or failed attestation blocks the pointer
      # commit. The ordering IS the enforcement — do not reorder these.
      - name: Attest published artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            populus-data/latest.json
            populus-data/builds/*/manifest.json

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run populus verify --data-repo populus-data --attestation=sigstore

      - name: Commit manifest and pointer (rebase-retry x3, §13.3)
        working-directory: populus-data
        run: |
          git config user.name "populus-publish[bot]"
          git config user.email "populus-publish@users.noreply.github.com"
          git add builds latest.json
          git commit -m "data: publish build"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 rebase retries (no force push, ever)" >&2
          exit 1
