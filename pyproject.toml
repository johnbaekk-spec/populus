[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "populus-mcp"
dynamic = ["version"]
description = "Populus — open financial-data commons (M1: congressional trading)"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "lxml",
    "packaging",
    "pdfplumber",
    "pypdf",
    "pyyaml",
    "click",
    "rfc8785",
    "sigstore>=3.6.1",
    "mcp>=1.28.1",
]

[project.scripts]
populus = "populus.cli:main"
populus-mcp = "populus.mcp_server.server:main"

[dependency-groups]
dev = ["pytest", "jsonschema", "pip-audit==2.10.1"]

[tool.hatch.version]
path = "src/populus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/populus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
