[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "populus-mcp"
dynamic = ["version"]
description = "Populus — the open financial-data commons behind Public Filings (congressional trading + institutional 13F)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "lxml",
    "packaging",
    "pdfplumber",
    "pypdf",
    "pyyaml",
    "click",
    "rfc8785",
    "sigstore>=3.6.1",
    "mcp>=1.28.1",
]

[project.scripts]
populus = "populus.cli:main"
populus-mcp = "populus.mcp_server.server:main"
populus-monitor = "populus.monitoring.monitor:main"

[project.urls]
Repository = "https://github.com/johnbaekk-spec/populus"
Site = "https://publicfilings.org"

[dependency-groups]
dev = ["pytest", "jsonschema", "pip-audit==2.10.1"]

[tool.hatch.version]
path = "src/populus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/populus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
